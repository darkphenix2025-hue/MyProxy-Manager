name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:version
      - run: npm run check:version
      - run: npm run build

  rust:
    runs-on: ubuntu-24.04
    env:
      # Rust tests use a shared SQLite store and several process-wide config
      # singletons. Keep CI data isolated from the runner and execute the suite
      # deterministically in one test thread.
      ABV_DATA_DIR: ${{ runner.temp }}/myproxy-data
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare isolated test data directory
        run: mkdir -p "$ABV_DATA_DIR"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features -- --test-threads=1
