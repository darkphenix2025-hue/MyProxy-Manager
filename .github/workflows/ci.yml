name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:version
      - run: npm run check:version
      - run: npm run build

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare isolated test data directory
        run: |
          # Rust tests use a shared SQLite store and process-wide config
          # singletons. Keep CI data isolated from the runner and expose the
          # directory to all later steps.
          ABV_DATA_DIR="${RUNNER_TEMP:-/tmp}/myproxy-data"
          mkdir -p "$ABV_DATA_DIR"
          echo "ABV_DATA_DIR=$ABV_DATA_DIR" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Clippy correctness lints
        run: |
          # The repository currently has a legacy style-warning baseline;
          # correctness lints remain blocking while the full -D warnings
          # cleanup is handled separately.
          cargo clippy --manifest-path src-tauri/Cargo.toml \
            --all-targets --all-features -- -D clippy::correctness
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features -- --test-threads=1

  tauri-build:
    name: Tauri debug build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-14
            target: aarch64-apple-darwin
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Install NASM (Windows)
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: choco install nasm --no-progress --yes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Tauri app without release signing
        uses: tauri-apps/tauri-action@v1
        with:
          args: >-
            --debug --target ${{ matrix.target }}
            --config '{"bundle":{"active":false,"createUpdaterArtifacts":false}}'
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

  tauri-build-gate:
    name: tauri-build
    needs: tauri-build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform build to pass
        if: needs.tauri-build.result != 'success'
        run: |
          echo "Tauri matrix result: ${{ needs.tauri-build.result }}" >&2
          exit 1
      - run: echo 'All Tauri debug builds passed.'
